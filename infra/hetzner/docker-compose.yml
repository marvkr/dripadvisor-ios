# Production docker-compose for the Hetzner box.
# Postgres → Neon (serverless), object storage → Cloudflare R2.
# Box only runs: redis (chat fan-out + rate limits), backend, caddy, riverui, camoufox (on host).
#
# Differences from infra/docker-compose.yml (local dev which still uses docker pg + minio):
#   - backend runs distroless container, talks to Neon over TLS + R2 over HTTPS
#   - redis stays local (no managed dep yet; Upstash is the v2 swap)
#   - caddy fronts TLS on :443
#
# Run on the box:
#   cd /opt/dripadvisor
#   docker compose -f infra/hetzner/docker-compose.yml --env-file /etc/dripadvisor/env up -d --build

services:
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --save "300 10"
    volumes:
      - redisdata:/data
    networks: [dripnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ../..                  # repo root, so apps/backend is reachable
      dockerfile: apps/backend/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      redis: { condition: service_healthy }
    environment:
      ENV: prod
      HTTP_ADDR: ":8080"
      # Neon connection string. Includes ?sslmode=require + channel binding.
      DATABASE_URL: ${DATABASE_URL}
      REDIS_ADDR: redis:6379
      # Cloudflare R2 (S3-compatible). Endpoint = https://<account-id>.r2.cloudflarestorage.com
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-dripadvisor-prod}
      S3_REGION: ${S3_REGION:-auto}
      # R2 uses virtual-hosted-style URLs, not path-style.
      S3_USE_PATH_STYLE: "false"
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.dripadvisor.DripAdvisor}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-720}"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CAMOFOX_URL: ${CAMOFOX_URL:-http://host.docker.internal:9377}
      REMBG_URL: ${REMBG_URL:-http://rembg:7000}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [dripnet]
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The Go binary doesn't actually expose --healthcheck yet — distroless
      # has no shell so we can't use wget/curl. Caddy upstream check covers
      # liveness; this stanza is documented intent for when we add it.
      disable: true

  rembg:
    # Background removal HTTP server. POST /api/remove returns transparent PNG.
    # Default model u2net bundled; set REMBG_MODEL env to swap to bria-rmbg.
    image: danielgatis/rembg:latest
    restart: unless-stopped
    command: s --host 0.0.0.0 --port 7000
    networks: [dripnet]
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:7000/openapi.json"]
      interval: 15s
      timeout: 5s
      retries: 10

  riverui:
    # River jobs dashboard. Bound to loopback only — reach via SSH tunnel:
    #   ssh -i ~/.ssh/id_ed25519_hetzner -fN -L 8085:localhost:8085 root@<box-ip>
    # then open http://localhost:8085 on your laptop.
    image: ghcr.io/riverqueue/riverui:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: ${DATABASE_URL}
    ports:
      - "127.0.0.1:8085:8080"
    networks: [dripnet]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST:-api.dripadvisor.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [dripnet]
    depends_on:
      - backend

networks:
  dripnet:
    driver: bridge

volumes:
  redisdata:
  caddydata:
  caddyconfig:
