# Production docker-compose for the single Hetzner box.
# Differences from infra/docker-compose.yml (local dev):
#   - backend service runs the Go binary in a distroless container
#   - postgres / redis / minio bound to internal network only (no host ports)
#   - caddy in front for TLS + reverse proxy on :443
#   - all services restart=unless-stopped, healthchecks tightened
#
# Run on the box:
#   cd /opt/dripadvisor
#   docker compose -f infra/hetzner/docker-compose.yml --env-file /etc/dripadvisor/env up -d --build

services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${PG_USER:-dripadvisor}
      POSTGRES_PASSWORD: ${PG_PASSWORD}
      POSTGRES_DB: ${PG_DB:-dripadvisor}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [dripnet]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PG_USER:-dripadvisor} -d ${PG_DB:-dripadvisor}"]
      interval: 5s
      timeout: 5s
      retries: 30

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --appendonly yes --appendfsync everysec --save "300 10"
    volumes:
      - redisdata:/data
    networks: [dripnet]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 30

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - miniodata:/data
    networks: [dripnet]
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 30

  backend:
    build:
      context: ../..                  # repo root, so apps/backend is reachable
      dockerfile: apps/backend/Dockerfile
      args:
        VERSION: ${VERSION:-dev}
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      redis:    { condition: service_healthy }
      minio:    { condition: service_healthy }
    environment:
      ENV: prod
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://${PG_USER:-dripadvisor}:${PG_PASSWORD}@postgres:5432/${PG_DB:-dripadvisor}?sslmode=disable
      REDIS_ADDR: redis:6379
      S3_ENDPOINT: http://minio:9000
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET:-dripadvisor-prod}
      S3_REGION: ${S3_REGION:-us-east-1}
      S3_USE_PATH_STYLE: "true"
      JWT_SIGNING_SECRET: ${JWT_SIGNING_SECRET}
      APPLE_BUNDLE_ID: ${APPLE_BUNDLE_ID:-com.dripadvisor.DripAdvisor}
      APPLE_TEAM_ID: ${APPLE_TEAM_ID}
      SESSION_TTL_HOURS: "${SESSION_TTL_HOURS:-720}"
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      CAMOFOX_URL: ${CAMOFOX_URL:-http://host.docker.internal:9377}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [dripnet]
    healthcheck:
      test: ["CMD", "/server", "--healthcheck"]
      interval: 30s
      timeout: 5s
      retries: 5
      # The Go binary doesn't actually expose --healthcheck yet — distroless
      # has no shell so we can't use wget/curl. Caddy upstream check covers
      # liveness; this stanza is documented intent for when we add it.
      disable: true

  riverui:
    # River jobs dashboard. Bound to loopback only — reach via SSH tunnel:
    #   ssh -i ~/.ssh/id_ed25519_hetzner -fN -L 8085:localhost:8085 root@<box-ip>
    # then open http://localhost:8085 on your laptop.
    image: ghcr.io/riverqueue/riverui:latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://${PG_USER:-dripadvisor}:${PG_PASSWORD}@postgres:5432/${PG_DB:-dripadvisor}?sslmode=disable
    ports:
      - "127.0.0.1:8085:8080"
    depends_on:
      postgres: { condition: service_healthy }
    networks: [dripnet]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    environment:
      API_HOST: ${API_HOST:-api.dripadvisor.app}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddydata:/data
      - caddyconfig:/config
    networks: [dripnet]
    depends_on:
      - backend

networks:
  dripnet:
    driver: bridge

volumes:
  pgdata:
  redisdata:
  miniodata:
  caddydata:
  caddyconfig:
