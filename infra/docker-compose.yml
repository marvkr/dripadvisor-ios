services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dripadvisor
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: dripadvisor
    ports:
      - "54329:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dripadvisor -d dripadvisor"]
      interval: 2s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --appendfsync everysec
    ports:
      - "6380:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 3s
      retries: 20

  riverui:
    image: ghcr.io/riverqueue/riverui:latest
    environment:
      DATABASE_URL: postgres://dripadvisor:dev@postgres:5432/dripadvisor?sslmode=disable
    ports:
      - "8085:8080"
    depends_on:
      postgres: { condition: service_healthy }

  rembg:
    # Background removal HTTP server. Default model bundled (u2net) ~170MB;
    # downloads better models (birefnet-general, bria-rmbg) on first request.
    # API: POST /api/remove (multipart image file) → PNG bytes with alpha.
    image: danielgatis/rembg:latest
    command: s --host 0.0.0.0 --port 7000
    ports:
      - "7700:7000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O- http://localhost:7000/api/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
  redisdata:
  miniodata:
