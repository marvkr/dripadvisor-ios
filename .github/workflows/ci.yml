name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  ios:
    name: iOS (xcodebuild)
    runs-on: macos-15
    # Don't gate merges on iOS until the GitHub runner image ships a
    # matching iOS Simulator runtime. The build can succeed locally + on Cmd+R
    # in Xcode; the runner image is missing the simulator runtime that Xcode
    # 16 GA wants. Revisit when GitHub bumps the macos-15 image.
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Pin Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Show runtimes (diagnostic)
        run: |
          echo "--- Xcode ---"; xcodebuild -version
          echo "--- Runtimes ---"; xcrun simctl list runtimes
      - name: Build
        run: |
          xcodebuild \
            -project apps/ios/DripAdvisor.xcodeproj \
            -scheme DripAdvisor \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -skipPackagePluginValidation \
            build

  chrome-extension:
    name: Chrome extension (manifest sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chrome-extension
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log('manifest_version', m.manifest_version);"
