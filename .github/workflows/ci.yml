name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  ios:
    name: iOS (xcodebuild)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_16.app || true
      - name: Build
        run: |
          xcodebuild \
            -project apps/ios/DripAdvisor.xcodeproj \
            -scheme DripAdvisor \
            -destination 'platform=iOS Simulator,name=iPhone 17 Pro,OS=latest' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            build

  chrome-extension:
    name: Chrome extension (manifest sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chrome-extension
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log('manifest_version', m.manifest_version);"
