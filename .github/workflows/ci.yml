name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    name: Backend (Go)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
          cache-dependency-path: apps/backend/go.sum
      - run: go build ./...
      - run: go vet ./...
      - run: go test ./...

  ios:
    name: iOS (xcodebuild)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Select Xcode
        # macos-15 ships Xcode 16 + iOS Simulator 18 runtime (build 22A3362).
        # We don't install iOS 26 runtime in CI (would take ~10min); building
        # for a generic simulator against the iOS 18 SDK is enough to catch
        # compile + link regressions, which is the whole point of the CI gate.
        run: sudo xcode-select -s /Applications/Xcode_16.app || true
      - name: Show available simulators
        run: xcrun simctl list runtimes
      - name: Build
        run: |
          xcodebuild \
            -project apps/ios/DripAdvisor.xcodeproj \
            -scheme DripAdvisor \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build

  chrome-extension:
    name: Chrome extension (manifest sanity)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/chrome-extension
    steps:
      - uses: actions/checkout@v4
      - run: node -e "const m=require('./manifest.json'); if(m.manifest_version!==3) process.exit(1); console.log('manifest_version', m.manifest_version);"
